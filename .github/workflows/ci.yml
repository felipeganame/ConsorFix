name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.12.0

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo 2 usa envMode strict: una variable que no esté en globalEnv llega
      # como undefined sin dar error, y el síntoma aparece lejos de la causa.
      - run: node scripts/check-turbo-env.cjs
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los unitarios corren con cobertura: packages/domain tiene umbral >=75%
      # (regla 7), definido en su vitest.config.ts.
      - run: pnpm test
      - run: pnpm --filter @consorciofix/domain test:coverage

  # Las suites de integración y de aislamiento corren contra un Postgres real:
  # necesitan pgvector, las migraciones aplicadas y —sobre todo— la separación
  # de roles owner/app, porque RLS no aplica al dueño de las tablas (regla 1 de
  # CLAUDE.md). Reusamos el MISMO script de bootstrap que docker compose para
  # que dev y CI no divergan.
  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: consorciofix
          POSTGRES_USER: owner_user
          POSTGRES_PASSWORD: owner_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owner_user -d consorciofix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://app_user:app_pass@localhost:5432/consorciofix
      DATABASE_OWNER_URL: postgres://owner_user:owner_pass@localhost:5432/consorciofix
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap extensiones y roles
        run: psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/01-extensions-and-roles.sql
      - run: pnpm db:migrate
      # Con --coverage: los umbrales por módulo de vitest.integration.config.ts
      # hacen fallar el job si la cobertura de los módulos que nombra la regla 7
      # (RBAC, tickets) baja. Antes la regla decía "CI bloquea por debajo del
      # 70%" y era falso, porque no existía ningún umbral definido.
      - run: pnpm test:integration -- --coverage

  isolation:
    name: Multi-tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: consorciofix
          POSTGRES_USER: owner_user
          POSTGRES_PASSWORD: owner_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owner_user -d consorciofix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://app_user:app_pass@localhost:5432/consorciofix
      DATABASE_OWNER_URL: postgres://owner_user:owner_pass@localhost:5432/consorciofix
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap extensiones y roles
        run: psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/01-extensions-and-roles.sql
      - run: pnpm db:migrate
      - run: pnpm test:isolation

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/audit-ci.cjs
