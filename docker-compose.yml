services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: consorciofix-postgres
    environment:
      POSTGRES_DB: consorciofix
      POSTGRES_USER: owner_user
      POSTGRES_PASSWORD: owner_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner_user -d consorciofix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: consorciofix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: consorciofix-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/consorciofix-media &&
      mc anonymous set none local/consorciofix-media &&
      echo 'minio bucket ready (privado: la media de un ticket de unidad o de conducta no puede ser publica)'
      "

  mock-whatsapp:
    build:
      context: ./infra/docker/mock-whatsapp
    container_name: consorciofix-mock-whatsapp
    ports:
      - "8081:8081"

  mock-ai:
    build:
      context: ./infra/docker/mock-ai
    container_name: consorciofix-mock-ai
    ports:
      - "8082:8082"

volumes:
  postgres-data:
  minio-data:
